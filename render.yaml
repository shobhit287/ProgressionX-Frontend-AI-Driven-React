# Render Blueprint — free static site.
# Dashboard → New → Blueprint → pick this repo/branch, and Render reads this
# file. The rewrite makes deep links (/session/abc, /analytics) serve
# index.html so the SPA router and the offline service worker can handle
# them; sw.js must never be cached so updates roll out.
services:
  - type: web
    name: progressionx
    runtime: static
    branch: offline-pwa
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
